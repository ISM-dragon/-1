services:
  opus-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    env_file:
      - ./gateway/.env.production
    volumes:
      - opus_gateway_data:/data
    # Keep Gateway private behind a reverse proxy. Do not expose 8787 directly to the internet.
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  opus_gateway_data:
