name: ISM Quality Gate

on:
  push:
    paths:
      - "gateway/**"
      - "pipeline/**"
      - "app/**"
      - "android/**"
      - "docs/**"
      - "VERSION"
      - "scripts/**"
      - "pytest.ini"
      - "conftest.py"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "pipeline/**"
      - "app/**"
      - "android/**"
      - "docs/**"
      - "VERSION"
      - "scripts/**"
      - "pytest.ini"
      - "conftest.py"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Gateway and pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest scipy librosa
      - name: Check product identity
        run: python scripts/check_identity.py
      - name: Run Gateway tests
        run: python -m pytest gateway -q
      - name: Run pipeline tests
        working-directory: pipeline
        run: python -m pytest tests -q

  desktop-quality:
    name: Desktop typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install desktop dependencies
        working-directory: app
        run: npm ci
      - name: Build desktop app
        working-directory: app
        run: npm run build
